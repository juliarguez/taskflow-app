<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To - Do App</title>
</head>

<body>
    <h1>Mis tareas</h1>

    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Nueva tarea" required>
        <button type="submit">Añadir</button>
    </form>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    {% if task.done %}
                        ✔
                    {% else %}
                        ✘
                    {% endif %}

                    {{ task.title }}

                    <a href="/delete/{{ loop.index0 }}">Eliminar</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hay tareas.</p>
    {% endif %}
</body>

</html>
