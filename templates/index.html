<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="app-header">
        <h1>TaskFlow</h1>
        <p class="subtitle">Organize your tasks and boost your productivity</p>
    </header>

    <h2 class="tasks-title">My tasks</h2>

    <div class="top-buttons">
        <form action="/clear" method="POST" onsubmit="return confirm('Are you sure you want to delete ALL tasks?')">
            <button type="submit" 
                {% if not tasks %}
                disabled
                {% endif %}
                class="danger-btn">
                Delete all tasks
            </button>
        </form>

        <a href="/completed" class="completed">Completed Tasks</a>

    </div>
    
    <form class="task-form" action="/add" method="POST">
        <input type="text" name="title" placeholder="New task" required autofocus>
        <button type="submit">Add</button>
    </form>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    <span class="task-text">
                        {{ task.title }}
                    </span>

                    <div class="actions">
                        <a class="complete-btn" href="/complete/{{ loop.index0 }}">Complete</a>

                        <a class="edit-btn" href="/edit/{{ loop.index0 }}">Edit</a>

                        <a class="delete-btn" href="/delete/{{ loop.index0 }}" onclick="return confirm('Are you sure you want to delete this task?')">Delete</a>
                    </div>
                    
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p style="text-align: center; color: gray;">
            💤 No tasks yet... Add your first one!!!
        </p>
    {% endif %}

</body>

</html>
