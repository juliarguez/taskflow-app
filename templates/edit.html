<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    
    <header class="app-header">
        <h1>TaskFlow</h1>
        <p class="subtitle">Organize your tasks and boost your productivity</p>
    </header>

    <h2 class="tasks-title">Edit Task</h2>

    <form class="task-form" action="/update/{{ index }}" method="POST">
        <input type="text" name="title" value="{{ task.title }}" required autofocus>
        <button type="submit">Save</button>
    </form>

    <br>

    <a href="/">Back</a>

    <script>
        window.onload = function() {
            let input = document.querySelector("input[name='title']");
            let length = input.value.length;
            input.focus();
            input.setSelectionRange(length, length);
        }
    </script>

</body>
</html>
